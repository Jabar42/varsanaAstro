<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#779B05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Three Domes (Symbolic of Varsana architecture) -->
  <path d="M40,140 Q40,80 70,80 Q100,80 100,140" fill="none" stroke="#779B05" stroke-width="8" />
  <path d="M70,130 Q70,50 100,50 Q130,50 130,130" fill="none" stroke="#F7941E" stroke-width="10" />
  <path d="M100,140 Q100,80 130,80 Q160,80 160,140" fill="none" stroke="#779B05" stroke-width="8" />
  <!-- Lotus Base -->
  <path d="M30,150 Q100,180 170,150" fill="none" stroke="#52185B" stroke-width="4" stroke-linecap="round" />
  <!-- Spiritual Sun/Dot -->
  <circle cx="100" cy="30" r="8" fill="#F7941E" />
</svg>
