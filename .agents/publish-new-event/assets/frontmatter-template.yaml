# Frontmatter template for a new event
# Copy this YAML block into your Markdown file and replace the placeholder values.

---
id: "unique-event-id"
title: "Title of the event"
description: "A short, compelling description for SEO and cards."
event_start: YYYY-MM-DD
event_end: YYYY-MM-DD  # optional, omit for single-day events
image: "https://picsum.photos/seed/event/1600/1000"
stock_max: 100
destacado: false  # set to true to feature this event in the homepage slider
orden: 0          # sort order within the slider (lower = first)
prices:
  - label: "Early Bird"
    amount: 50000
    deadline: YYYY-MM-DD
  - label: "General"
    amount: 70000
---
