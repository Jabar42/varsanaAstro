<!--
Card template for Varsana design system.
Use this as a starting point for event cards, pasadía cards, team cards, etc.
-->

<div class="bg-white rounded-3xl shadow-airbnb p-6 hover:shadow-xl transition-shadow duration-300">
  <!-- Card Image -->
  <div class="mb-4 overflow-hidden rounded-2xl">
    <img src="/team/juan-perez.jpg" alt="Juan Pérez" class="w-full h-48 object-cover" />
  </div>

  <!-- Card Content -->
  <h3 class="text-2xl font-bold text-near-black mb-2">Juan Pérez</h3>
  <p class="text-secondary-gray mb-4">Yoga instructor & meditation guide with 10+ years of experience.</p>

  <!-- Tags -->
  <div class="flex flex-wrap gap-2 mb-6">
    <span class="bg-saffron text-white text-sm font-medium py-1 px-3 rounded-full">Yoga</span>
    <span class="bg-forest text-white text-sm font-medium py-1 px-3 rounded-full">Meditation</span>
    <span class="bg-rausch text-white text-sm font-medium py-1 px-3 rounded-full">Wellness</span>
  </div>

  <!-- Action Button -->
  <a href="#" class="inline-block bg-rausch text-white font-semibold py-2 px-5 rounded-2xl hover:bg-opacity-90 transition-all duration-300">
    View Profile
  </a>
</div>

<!-- Alternative Card with Icon -->

      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-leaf text-forest"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>

    </div>
  </div>
</div>
